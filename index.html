<!DOCTYPE html>
<html>
<head>
    <title>Days to Ramadan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Updated Background Image Filename */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logoRamand.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Container set to align at the TOP */
        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        /* Number position - set very high */
        .days-only {
            margin-top: 20px; /* Moves the number to the very top */
            font-size: 50px; 
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px 30px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <div class="days-only" id="days">--</div>
    </div>

    <script>
        function updateDays() {
            // Updated for the year 2026
            const ramadan = new Date("February 18, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = ramadan - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            document.getElementById("days").innerText = d > 0 ? d : "0";
        }

        updateDays();
        setInterval(updateDays, 3600000); 
    </script>

</body>
</html>
