<!DOCTYPE html>
<html>
<head>
    <title>Days to Ramadan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Background Image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logoRamadan.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Container alignment */
        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        /* Updated Days Box */
        .days-only {
            margin-top: 150px; /* Adjusted slightly to accommodate larger text */
            
            /* Font Customization */
            font-size: 120px; /* Significantly larger font */
            font-weight: bold;
            color: #5D4037; /* Dark brown text for better contrast on cream */
            text-align: center;
            
            /* Cream Box Styling */
            background-color: #FFFDD0; /* Solid Cream Color */
            padding: 20px 50px;
            border-radius: 20px;
            
            /* Shadow for depth */
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            
            /* Optional: Add a slight border */
            border: 2px solid #F0E68C;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <div class="days-only" id="days">--</div>
    </div>

    <script>
        function updateDays() {
            // Target date: Ramadan 2026 (approx Feb 18)
            const ramadan = new Date("February 18, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = ramadan - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Displays remaining days
            document.getElementById("days").innerText = d > 0 ? d : "0";
        }

        updateDays();
        // Update every hour
        setInterval(updateDays, 3600000); 
    </script>

</body>
</html>
