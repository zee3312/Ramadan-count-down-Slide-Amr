<!DOCTYPE html>
<html>
<head>
    <title>Days to Ramadan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Background Image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logoRamadan.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Container alignment */
        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        /* Adjusted Days Box */
        .days-only {
            margin-top: 200px; 
            
            /* Font Customization */
            font-size: 80px; /* Reduced from 120px to be large but not "too large" */
            font-weight: bold;
            color: #333333; /* Dark grey text for readability on light background */
            text-align: center;
            
            /* Box Styling */
            background-color: #f8f8f8; /* Specific requested color code */
            padding: 10px 40px;
            border-radius: 15px;
            
            /* Subtle shadow to make the light box pop against the background */
            box-shadow: 0px 4px 20px rgba(0,0,0,0.2);
            
            /* Ensures the box doesn't get too wide if the number is small */
            min-width: 120px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <div class="days-only" id="days">--</div>
    </div>

    <script>
        function updateDays() {
            // Target date: Ramadan 2026 (estimated February 18, 2026)
            const ramadan = new Date("February 18, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = ramadan - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Displays remaining days
            document.getElementById("days").innerText = d > 0 ? d : "0";
        }

        updateDays();
        // Update every hour
        setInterval(updateDays, 3600000); 
    </script>

</body>
</html>
