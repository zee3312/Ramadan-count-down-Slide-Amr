<!DOCTYPE html>
<html>
<head>
    <title>Ramadan 2026</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Full Slide Background Image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logoRamadan.png'); /* Put your image name here */
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Giant Bold Days Count */
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.3); /* darkens image slightly to make text pop */
        }

        .days-number {
            font-size: 250px; /* Massive size */
            font-weight: bold;
            margin: 0;
            text-shadow: 5px 5px 15px rgba(0,0,0,0.8);
        }

        .label {
            font-size: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <div class="days-number" id="days">--</div>
        <div class="label">Days to Ramadan</div>
    </div>

    <script>
        function updateDays() {
            const ramadan = new Date("February 18, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = ramadan - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Show 0 if Ramadan has started
            document.getElementById("days").innerText = d > 0 ? d : "0";
        }

        updateDays();
        setInterval(updateDays, 3600000); // Updates every hour
    </script>

</body>
</html>
