<!DOCTYPE html>
<html>
<head>
    <title>Days to Ramadan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Full Screen Background Image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logoRamadan.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Centered Container */
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 50px is 5 times smaller than the previous 250px */
        .days-only {
            font-size: 50px; 
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4); /* Dark circle/box behind number for visibility */
            padding: 20px 40px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <div class="days-only" id="days">--</div>
    </div>

    <script>
        function updateDays() {
            // Target date: February 18, 2026
            const ramadan = new Date("February 18, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = ramadan - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            // Displays only the number
            document.getElementById("days").innerText = d > 0 ? d : "0";
        }

        updateDays();
        // Check once an hour to keep it accurate
        setInterval(updateDays, 3600000); 
    </script>

</body>
</html>
